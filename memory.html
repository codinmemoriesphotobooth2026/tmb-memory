<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Memory — The Memories Photobooth</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      padding: 32px 16px 60px;
      color: #111;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header .logo-text {
      font-size: clamp(22px, 6vw, 32px);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #111;
    }
    .header .sub {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: clamp(14px, 3.5vw, 17px);
      color: #888;
      margin-top: 6px;
    }

    .assets {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 420px;
      margin: 0 auto;
    }

    .asset-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .asset-card img {
      width: 100%;
      display: block;
      background: #e0e0e0;
    }

    .asset-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-top: 1px solid #f0f0f0;
    }

    .asset-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #111;
    }
    .asset-sub {
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
    }

    .save-btn {
      background: #111;
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 100px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s;
    }
    .save-btn:hover { background: #333; }

    .empty {
      text-align: center;
      color: #aaa;
      font-size: 15px;
      margin-top: 80px;
      font-family: 'EB Garamond', serif;
      font-style: italic;
    }

    .footer-note {
      text-align: center;
      margin-top: 40px;
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: #bbb;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-text">The Memories</div>
    <div class="sub">your photobooth moment</div>
  </div>

  <div class="assets" id="assets"></div>
  <p class="footer-note">don't hesitate to be our story</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const p = params.get('p'); // composited photo with template
    const g = params.get('g'); // GIF with template
    const r = params.get('r'); // raw GIF

    const container = document.getElementById('assets');

    function addAsset(url, label, sublabel, filename) {
      if (!url) return;
      const card = document.createElement('div');
      card.className = 'asset-card';
      card.innerHTML = `
        <img src="${url}" alt="${label}" loading="lazy">
        <div class="asset-footer">
          <div>
            <div class="asset-label">${label}</div>
            <div class="asset-sub">${sublabel}</div>
          </div>
          <a class="save-btn" href="${url}" target="_blank" rel="noopener">SAVE</a>
        </div>
      `;
      container.appendChild(card);
    }

    if (!p && !g && !r) {
      container.innerHTML = '<p class="empty">No photos found for this link.</p>';
    } else {
      addAsset(p, 'Photo', 'with template', 'memory-photo.jpg');
      addAsset(g, 'Animated', 'with template', 'memory-animated.gif');
      addAsset(r, 'GIF', 'original capture', 'memory-raw.gif');
    }
  </script>

</body>
</html>
